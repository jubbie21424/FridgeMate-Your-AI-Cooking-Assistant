name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Check for syntax errors
        run: python -m py_compile mvp.py

      - name: Check for real code issues (unused/duplicate imports, unused variables)
        run: flake8 mvp.py --select=E9,F401,F811,F841

      - name: Smoke test - boot the app and confirm it responds
        run: |
          streamlit run mvp.py --server.headless true --server.port 8501 &
          sleep 10
          curl --fail http://localhost:8501
